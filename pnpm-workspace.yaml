packages:
  - "apps/*"
  - "packages/*"

# Expo SDK 52's Gradle autolinking needs this package resolvable from the app
# directory. Hoisting only the autolinker fixes ExpoModulesPackage's generated
# package import while preserving pnpm's isolated node_modules layout.
publicHoistPattern:
  - expo-modules-autolinking

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "core-js": true
  "prisma": true
overrides:
  "react@^19.0.0": 19.0.0
  "react-dom@^19.0.0": 19.0.0
  "@types/react@^19.0.2": 19.0.2
  "@types/react-dom@^19.0.2": 19.0.2

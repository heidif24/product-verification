name: One-time PAN feature branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'Remove merged PAN feature branches')
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed PAN feature branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              "feat/pan-market-ready-operations",
              "feat/pan-functional-core"
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`${branch} is already absent`);
                } else {
                  throw error;
                }
              }
            }
